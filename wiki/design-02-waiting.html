<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Parent Coach, waiting for a reply</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@400;600;700;800&amp;display=swap"
			rel="stylesheet"
		/>
		<style>
			body {
				margin: 0;
			}
			a {
				color: #5a3cc4;
			}
			a:hover {
				color: #3f2696;
			}
		</style>
	</head>
	<body>
		<div
			style="
				width: 390px;
				height: 844px;
				box-sizing: border-box;
				display: flex;
				flex-direction: column;
				background: #fbf7ff;
				font-family: &quot;Nunito&quot;, system-ui, sans-serif;
				color: #2a2140;
			"
		>
			<header
				style="
					display: flex;
					align-items: center;
					gap: 12px;
					padding: 20px 20px 14px;
					background: #ffffff;
					border-bottom: 2px solid #efe8ff;
				"
			>
				<div
					style="
						width: 44px;
						height: 44px;
						border-radius: 16px;
						background: #ffd6e4;
						display: flex;
						align-items: center;
						justify-content: center;
						flex-shrink: 0;
					"
				>
					<svg
						width="26"
						height="26"
						viewBox="0 0 24 24"
						fill="none"
						stroke="#9B2C5A"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
					>
						<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"></path>
						<path d="M9 11h.01M15 11h.01"></path>
						<path d="M9.5 14.5a3.5 3.5 0 0 0 5 0"></path>
					</svg>
				</div>
				<div style="display: flex; flex-direction: column; gap: 2px">
					<h1
						style="
							margin: 0;
							font-family: &quot;Fredoka&quot;, sans-serif;
							font-weight: 600;
							font-size: 22px;
							line-height: 1.1;
						"
					>
						Parent Coach
					</h1>
					<p style="margin: 0; font-size: 13px; color: #5b5170">
						Short, safe plans in English or Roman Urdu
					</p>
				</div>
			</header>

			<main
				style="
					flex: 1;
					display: flex;
					flex-direction: column;
					justify-content: flex-end;
					gap: 14px;
					padding: 16px;
				"
			>
				<p
					style="
						align-self: flex-end;
						max-width: 80%;
						margin: 0;
						padding: 12px 16px;
						border-radius: 20px 20px 6px 20px;
						background: #cdefe0;
						color: #17382a;
						font-size: 16px;
						line-height: 1.45;
					"
				>
					My daughter cries at school drop-off
				</p>
				<div
					role="status"
					style="
						align-self: flex-start;
						display: flex;
						align-items: center;
						gap: 12px;
						padding: 14px 18px;
						border: 2px solid #e9e1ff;
						border-radius: 6px 22px 22px 22px;
						background: #ffffff;
					"
				>
					<div style="display: flex; gap: 6px" aria-hidden="true">
						<div style="width: 10px; height: 10px; border-radius: 50%; background: #f4a3c0"></div>
						<div
							style="
								width: 10px;
								height: 10px;
								border-radius: 50%;
								background: #f7c873;
								margin-top: -6px;
							"
						></div>
						<div style="width: 10px; height: 10px; border-radius: 50%; background: #8ed1b4"></div>
					</div>
					<span style="font-size: 15px; font-weight: 700; color: #4a4060"
						>The coach is replying…</span
					>
				</div>
			</main>

			<form
				style="
					display: flex;
					flex-direction: column;
					gap: 8px;
					padding: 12px 16px 18px;
					background: #ffffff;
					border-top: 2px solid #efe8ff;
				"
			>
				<label for="concern" style="font-size: 13px; font-weight: 700; color: #4a4060"
					>Your concern</label
				>
				<div style="display: flex; align-items: flex-end; gap: 10px">
					<textarea
						id="concern"
						rows="2"
						placeholder="Type in English or Roman Urdu"
						style="
							flex: 1;
							box-sizing: border-box;
							min-height: 52px;
							padding: 12px 14px;
							border: 2px solid #d9ccff;
							border-radius: 18px;
							background: #fbf7ff;
							color: #2a2140;
							font:
								400 16px &quot;Nunito&quot;,
								sans-serif;
							resize: none;
						"
					></textarea>
					<button
						type="submit"
						aria-label="Send"
						disabled
						style="
							width: 52px;
							height: 52px;
							flex-shrink: 0;
							border: 0;
							border-radius: 50%;
							background: #c9bdeb;
							display: flex;
							align-items: center;
							justify-content: center;
						"
					>
						<svg
							width="22"
							height="22"
							viewBox="0 0 24 24"
							fill="none"
							stroke="#FFFFFF"
							stroke-width="2.2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<path d="M5 12h14M13 6l6 6-6 6"></path>
						</svg>
					</button>
				</div>
				<p style="margin: 0; font-size: 12px; color: #5b5170">
					Not a doctor or a lawyer. In an emergency, call
					<a href="tel:112" style="font-weight: 800">112</a>.
				</p>
			</form>
		</div>
	</body>
</html>
