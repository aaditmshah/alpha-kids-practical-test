<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Parent Coach, empty chat</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@400;600;700;800&amp;display=swap"
			rel="stylesheet"
		/>
		<style>
			body {
				margin: 0;
			}
			a {
				color: #5a3cc4;
			}
			a:hover {
				color: #3f2696;
			}
		</style>
	</head>
	<body>
		<div
			style="
				width: 390px;
				height: 844px;
				box-sizing: border-box;
				display: flex;
				flex-direction: column;
				background: #fbf7ff;
				font-family: &quot;Nunito&quot;, system-ui, sans-serif;
				color: #2a2140;
			"
		>
			<header
				style="
					display: flex;
					align-items: center;
					gap: 12px;
					padding: 20px 20px 14px;
					background: #ffffff;
					border-bottom: 2px solid #efe8ff;
				"
			>
				<div
					style="
						width: 44px;
						height: 44px;
						border-radius: 16px;
						background: #ffd6e4;
						display: flex;
						align-items: center;
						justify-content: center;
						flex-shrink: 0;
					"
				>
					<svg
						width="26"
						height="26"
						viewBox="0 0 24 24"
						fill="none"
						stroke="#9B2C5A"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
					>
						<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"></path>
						<path d="M9 11h.01M15 11h.01"></path>
						<path d="M9.5 14.5a3.5 3.5 0 0 0 5 0"></path>
					</svg>
				</div>
				<div style="display: flex; flex-direction: column; gap: 2px">
					<h1
						style="
							margin: 0;
							font-family: &quot;Fredoka&quot;, sans-serif;
							font-weight: 600;
							font-size: 22px;
							line-height: 1.1;
						"
					>
						Parent Coach
					</h1>
					<p style="margin: 0; font-size: 13px; color: #5b5170">
						Short, safe plans in English or Roman Urdu
					</p>
				</div>
			</header>

			<main
				style="
					flex: 1;
					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: center;
					gap: 18px;
					padding: 24px 28px;
					text-align: center;
				"
			>
				<div style="position: relative; width: 132px; height: 132px">
					<div
						style="
							position: absolute;
							left: 0;
							top: 10px;
							width: 112px;
							height: 112px;
							border-radius: 50%;
							background: #e9e1ff;
						"
					></div>
					<div
						style="
							position: absolute;
							right: 0;
							top: 0;
							width: 44px;
							height: 44px;
							border-radius: 50%;
							background: #ffe7a3;
						"
					></div>
					<div
						style="
							position: absolute;
							right: 8px;
							bottom: 6px;
							width: 28px;
							height: 28px;
							border-radius: 50%;
							background: #cdefe0;
						"
					></div>
					<svg
						style="position: absolute; left: 24px; top: 34px"
						width="64"
						height="64"
						viewBox="0 0 24 24"
						fill="none"
						stroke="#5A3CC4"
						stroke-width="1.6"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
					>
						<path
							d="M12 21s-7-4.4-9.3-9A5.2 5.2 0 0 1 12 6.5 5.2 5.2 0 0 1 21.3 12C19 16.6 12 21 12 21z"
						></path>
					</svg>
				</div>
				<h2
					style="
						margin: 0;
						font-family: &quot;Fredoka&quot;, sans-serif;
						font-weight: 600;
						font-size: 26px;
						line-height: 1.2;
					"
				>
					What's on your mind today?
				</h2>
				<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #4a4060">
					Tell me about a worry with your child, in English or Roman Urdu. You'll get a short plan
					and a time to check in.
				</p>
				<div
					style="
						display: flex;
						flex-wrap: wrap;
						justify-content: center;
						gap: 10px;
						margin-top: 4px;
					"
				>
					<button
						type="button"
						style="
							min-height: 44px;
							padding: 10px 16px;
							border: 0;
							border-radius: 999px;
							background: #cdefe0;
							color: #1f4d3a;
							font:
								700 15px &quot;Nunito&quot;,
								sans-serif;
						"
					>
						My toddler won't sleep
					</button>
					<button
						type="button"
						style="
							min-height: 44px;
							padding: 10px 16px;
							border: 0;
							border-radius: 999px;
							background: #ffe0d1;
							color: #6e2e12;
							font:
								700 15px &quot;Nunito&quot;,
								sans-serif;
						"
					>
						Meri beti khana nahi khati
					</button>
					<button
						type="button"
						style="
							min-height: 44px;
							padding: 10px 16px;
							border: 0;
							border-radius: 999px;
							background: #ddebff;
							color: #193e6b;
							font:
								700 15px &quot;Nunito&quot;,
								sans-serif;
						"
					>
						Tantrums at the shop
					</button>
				</div>
			</main>

			<form
				style="
					display: flex;
					flex-direction: column;
					gap: 8px;
					padding: 12px 16px 18px;
					background: #ffffff;
					border-top: 2px solid #efe8ff;
				"
			>
				<label for="concern" style="font-size: 13px; font-weight: 700; color: #4a4060"
					>Your concern</label
				>
				<div style="display: flex; align-items: flex-end; gap: 10px">
					<textarea
						id="concern"
						rows="2"
						placeholder="Type in English or Roman Urdu"
						style="
							flex: 1;
							box-sizing: border-box;
							min-height: 52px;
							padding: 12px 14px;
							border: 2px solid #d9ccff;
							border-radius: 18px;
							background: #fbf7ff;
							color: #2a2140;
							font:
								400 16px &quot;Nunito&quot;,
								sans-serif;
							resize: none;
						"
					></textarea>
					<button
						type="submit"
						aria-label="Send"
						style="
							width: 52px;
							height: 52px;
							flex-shrink: 0;
							border: 0;
							border-radius: 50%;
							background: #5a3cc4;
							display: flex;
							align-items: center;
							justify-content: center;
						"
					>
						<svg
							width="22"
							height="22"
							viewBox="0 0 24 24"
							fill="none"
							stroke="#FFFFFF"
							stroke-width="2.2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<path d="M5 12h14M13 6l6 6-6 6"></path>
						</svg>
					</button>
				</div>
				<p style="margin: 0; font-size: 12px; color: #5b5170">
					Not a doctor or a lawyer. In an emergency, call
					<a href="tel:112" style="font-weight: 800">112</a>.
				</p>
			</form>
		</div>
	</body>
</html>
